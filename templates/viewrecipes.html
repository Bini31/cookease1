{% extends 'base.html' %}
{% block content %}
{% load static %}
<body style="background-image: url('{% static 'image/3.jpg' %}'); background-size: cover;">
<div class="container mt-5 mb-5 p-5 w-75 text-center border border-2 border-light">
    <h3>
     View recipe</h3>

<div class="row">

    {% for i in recipes %}
    <div class="col-4 p-3"><div class="card mx-auto" style="width: 17rem;">
  <img src="{{i.image.url}}" height="300px" width="100%" class="card-img-top" alt="...">
  <div class="card-body text-primary">
    <h5 class="card-title text-body ">{{i.recipename}}</h5>

    <a class="btn btn-warning" href="{% url 'recipesbook:details' i.id %} ">Details</a>

  </div>
</div></div>
     {% endfor %}
</div>
    </div>
</body>
{% endblock %}
